name: Orbix
options:
  bundleIdPrefix: dev.orbix
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TVOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "3" # tvOS
    # Simulator builds don't sign. Device builds pass CODE_SIGNING_ALLOWED=YES
    # + DEVELOPMENT_TEAM=UG27UAHLA4 + CODE_SIGN_STYLE=Automatic on the
    # xcodebuild command line (see the device install invocation).
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Orbix:
    type: application
    platform: tvOS
    sources:
      - path: Sources/Orbix
      - path: Resources/Assets.xcassets
      # EN/RU String Catalog for the app's own UI strings (OrbixKit carries a
      # separate catalog for the strings its Top Shelf extension shares).
      - path: Resources/Localizable.xcstrings
    dependencies:
      - target: OrbixKit
      # Embed the Top Shelf content extension into the app's PlugIns folder.
      - target: OrbixTopShelf
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.tvos
        # App Group (baseURL) + shared Keychain group (device token) so the
        # Top Shelf extension can reach the same server. Inert on the
        # Simulator (no entitlement sandbox) but correct for device.
        CODE_SIGN_ENTITLEMENTS: Resources/Orbix.entitlements
        # tvOS "Brand Assets" App Icon & Top Shelf Image — see
        # Resources/Assets.xcassets/App Icon & Top Shelf Image.brandassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  OrbixIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/OrbixIOS
      - path: Resources-iOS
    dependencies:
      - target: OrbixKitIOS
    settings:
      base:
        INFOPLIST_FILE: Resources-iOS/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.ios
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  OrbixKit:
    type: framework
    platform: tvOS
    sources:
      - path: Sources/OrbixKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.tvos.kit
        GENERATE_INFOPLIST_FILE: "YES" # embedded framework needs an Info.plist to pass app-bundle validation
  OrbixTopShelf:
    # tvOS Top Shelf content extension: renders Continue Watching + Recommended
    # above the app icon on the Apple TV home screen. Separate process — reads
    # baseURL (App Group) + device token (shared Keychain) the app published.
    type: app-extension
    platform: tvOS
    sources:
      - path: Sources/OrbixTopShelf
    dependencies:
      # Link (don't embed) OrbixKit — the app already embeds it; the extension
      # resolves it from the containing app's Frameworks folder at runtime.
      - target: OrbixKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.tvos.topshelf
        INFOPLIST_FILE: Sources/OrbixTopShelf/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/OrbixTopShelf/OrbixTopShelf.entitlements
        # Explicit even though the project base sets it — an app extension is a
        # distinct bundle and the unsigned Simulator build must stay unsigned.
        CODE_SIGNING_ALLOWED: "NO"
        # Load OrbixKit from the containing app's Frameworks folder.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
  OrbixKitIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/OrbixKit
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.ios.kit
        PRODUCT_MODULE_NAME: OrbixKit
        PRODUCT_NAME: OrbixKit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
  OrbixKitTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/OrbixKitTests
    dependencies:
      - target: OrbixKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.tvos.kittests
  OrbixIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OrbixIOSUITests
    dependencies:
      - target: OrbixIOS
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbix.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OrbixIOS:
    build:
      targets:
        OrbixIOS: all
        OrbixIOSUITests: [test]
    test:
      targets:
        - OrbixIOSUITests
      environmentVariables:
        ORBIX_UI_TEST_BASE_URL: "$(ORBIX_UI_TEST_BASE_URL)"
        ORBIX_UI_TEST_TOKEN: "$(ORBIX_UI_TEST_TOKEN)"
  OrbixKit:
    build:
      targets:
        OrbixKit: all
        OrbixKitTests: [test]
    test:
      targets:
        - OrbixKitTests
      # SP2 M1 live-gate passthrough: xcodebuild does NOT forward the
      # invoking shell's environment into the simulator-hosted test
      # process. `$(VAR)` here is an Xcode build-setting macro, resolved
      # against the OrbixKit target's settings *including command-line
      # overrides* — so `xcodebuild ... test ORBIX_TEST_BASE_URL=... ` (a
      # plain build-setting override, no special prefix) makes it through
      # to `ProcessInfo.processInfo.environment` inside
      # PlaybackReadinessTests. Left unset, `$(VAR)` expands to empty, so
      # the test's env-unset guards still fire and it skips cleanly.
      environmentVariables:
        ORBIX_TEST_BASE_URL: "$(ORBIX_TEST_BASE_URL)"
        ORBIX_TEST_TOKEN: "$(ORBIX_TEST_TOKEN)"
        ORBIX_TEST_FILE_IDS: "$(ORBIX_TEST_FILE_IDS)"
